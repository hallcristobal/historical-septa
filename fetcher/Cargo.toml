[package]
name = "fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
septa = { path = ".." }
actix = "0.13.5"
actix-web = "4.11.0"
chrono = "0.4.41"
anyhow = { workspace = true }
dotenvy = { workspace = true }
# vendored because we need to cross compile!
reqwest = { version = "0.12.23", features = ["json", "native-tls-vendored"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["raw_value"] }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1.18.0", features = ["v4", "serde"] }
env_logger = { workspace = true }
pretty_env_logger = { workspace = true }
log = { workspace = true }
futures = "0.3.31"
amqprs = { workspace = true }

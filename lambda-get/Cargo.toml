[package]
name = "lambda-get"
version = "0.1.0"
edition = "2024"

[dependencies]
septa = { path = ".." }
chrono = "0.4.41"
anyhow = { workspace = true }
# vendored because we need to cross compile!
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["raw_value"] }
sqlx = { workspace = true }
tokio = { workspace = true }
pretty_env_logger = { workspace = true }
log = { workspace = true }
lambda_runtime = "1.1.3"
aws-config = { version = "1.8.16", features = ["behavior-version-latest"] }
aws-credential-types = "1.2.14"
aws-sigv4 = "1.4.3"
url = "2.5.8"
